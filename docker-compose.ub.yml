# UB-Finance: bu depodaki kaynak koddan imaj derleyip çalıştırır.
# (docker-compose.yml, orijinal FlyBudget'ın yayınlanmış imajını kullanır.)
#
# İlk kurulum ve komutlar: CALISTIRMA.md
services:
  ub-finance:
    # Banka senkronu (Plaid, SimpleFIN, Enable Banking) Türk bankalarını kapsamadığı için
    # kapalıdır. Açmak için ikisi birden gerekir: aşağıdaki build argümanı (istemci) ve
    # environment'ta FLYBUDGET_BANK_SYNC=true (sunucu). Bkz. CALISTIRMA.md.
    build:
      context: .
      # args:
      #   VITE_BANK_SYNC: 'true'
    image: ub-finance:local
    container_name: ub-finance
    ports:
      # Yalnızca bu bilgisayardan erişim. Ağdaki başka cihazlardan erişim için
      # '3001:3001' yapın ve FLYBUDGET_ALLOWED_HOSTS ayarlayın (bkz. CALISTIRMA.md).
      - '127.0.0.1:3001:3001'
    environment:
      - FLYBUDGET_DATA_KEY_FILE=/run/secrets/flybudget_data_key
      # - FLYBUDGET_BANK_SYNC=true
    secrets:
      - flybudget_data_key
    volumes:
      - ub-finance-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # HTTPS ile ev dışından erişim (bkz. CALISTIRMA.md, bölüm 7). Açmak için bu servisi ve en
  # alttaki caddy-data / caddy-config birimlerini yorumdan çıkarın, proje klasörüne bir
  # Caddyfile koyun ve ub-finance'in environment bölümüne FLYBUDGET_TRUST_PROXY=1 ile
  # FLYBUDGET_ALLOWED_HOSTS=<alan adınız> ekleyin. ub-finance'in portu 127.0.0.1'de kalsın.
  # caddy:
  #   image: caddy:2
  #   container_name: ub-finance-caddy
  #   ports:
  #     - '80:80'
  #     - '443:443'
  #     - '443:443/udp'
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy-data:/data
  #     - caddy-config:/config
  #   depends_on:
  #     - ub-finance
  #   restart: unless-stopped

secrets:
  flybudget_data_key:
    file: ./flybudget_data_key.txt

volumes:
  ub-finance-data:
  # caddy-data:
  # caddy-config:
